# Packmule
#
# Every pack is required. A player who declines is kicked. A player whose download fails is retried,
# then let in without that pack, and admins are told.
#
# 1. Name your packs. Each pack is one of:
#
#    A per-build address, with the SHA-1 in the file name. Nothing else needed:
#      url: https://packs.example.com/TOKEN/0123456789abcdef0123456789abcdef01234567.zip
#
#    A moving address with a hash file next to it. Packmule reads the hash at startup and on
#    /packmule recheck. If <same folder>/<sha1>.zip serves that exact build, players get that address
#    instead, so nobody downloads a file that changed under an old hash:
#      url: https://packs.example.com/TOKEN/pack.zip
#      sha1-url: https://packs.example.com/TOKEN/pack.zip.sha1
#
#    Any address, with the SHA-1 written here:
#      url: https://example.com/my-pack.zip
#      sha1: 0123456789abcdef0123456789abcdef01234567
#
# 2. List every world, each Nether and End included, with the packs it gets in order. Later packs
#    sit on top of earlier ones. An empty list [] means Packmule sends that world nothing.
#    A world that isn't listed also gets nothing, and Packmule warns about it at startup.
#
# Packmule only ever removes packs it sent. Other plugins' packs (BlueMapMini's, say) are left alone.
# Leave resource-pack= empty in server.properties: a pack there fights Packmule's.

packs: {}
#  main:
#    url: https://packs.example.com/TOKEN/0123456789abcdef0123456789abcdef01234567.zip

worlds: {}
#  world: [main]
#  world_nether: [main]
#  world_the_end: [main]
#  some_other_world: []

# What players see. MiniMessage formatting: <b>bold</b>, <gray>colours</gray>, <newline> for a line break.
# Leave a message out to use its default. Players never see pack or world names from this file.
messages:
  # On the client's pack prompt, above its Proceed and Disconnect buttons.
  prompt: "This world has its own resource pack. Choose <b>Proceed</b> to download it and keep playing."
  # Kick screen after a player declines. A game set to refuse server packs declines without asking.
  declined: "<b>This server needs its resource packs to play.</b><newline><newline>The download was declined. Rejoin and choose <b>Proceed</b> when asked.<newline><newline><gray>Not asked at all? Your game is set to refuse server packs. In Multiplayer, select this server, choose Edit, and set Server Resource Packs to Prompt or Enabled.</gray>"
  # Kick screen when the prompt isn't answered. <seconds> is answer-timeout-seconds.
  no-answer: "<b>The resource pack prompt timed out.</b><newline><newline>It wasn't answered within <seconds> seconds. Rejoin and choose <b>Proceed</b> when asked."
  # In chat, once, when a download still fails after its retries. The player stays.
  download-failed: "<yellow>This world's resource pack couldn't be downloaded, so some things may look different. Rejoin to try again.</yellow>"
  # In chat, once, when a pack for this world has a dead link. Admins get the details.
  unavailable: "<yellow>Part of this world's resource pack isn't available right now, so some things may look different. Staff have been told.</yellow>"

# A client that doesn't answer the prompt in this many seconds is kicked.
answer-timeout-seconds: 60

# Times a failed download is sent again before the player is let in without that pack.
download-retries: 2

# How long a link check waits for a host to connect or send more data, in seconds.
check-timeout-seconds: 10
