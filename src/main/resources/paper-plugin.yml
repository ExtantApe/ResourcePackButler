name: Packmule
version: '${version}'
main: com.extantape.packmule.Packmule
api-version: '26.1'
description: Sends each world its own required resource packs, and warns at startup when a pack link is dead.
website: https://github.com/ExtantApe/Packmule
permissions:
  packmule.recheck:
    description: Use /packmule recheck, which re-tests every link and re-reads every hash file.
    default: op
  packmule.reload:
    description: Use /packmule reload, which reads config.yml again and re-checks.
    default: op
  packmule.status:
    description: Use /packmule status.
    default: op
  packmule.pack.set:
    description: Use /packmule pack set, which points a pack at a new per-build address after checking it. Leaf Juice uses it.
    default: op
  packmule.notify:
    description: See warnings about dead links and failed downloads in chat.
    default: op
